[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfsu2-vice-city-offline-launcher"
version = "0.1.0"
description = "Offline-only Windows launcher for separately configured local game builds"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
