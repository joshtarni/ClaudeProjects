[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-editor"
version = "1.0.0"
requires-python = ">=3.12,<3.16"
dependencies = [
  "PyMuPDF==1.26.6",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]
build = ["pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
